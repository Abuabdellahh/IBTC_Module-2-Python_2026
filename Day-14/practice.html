<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Boxes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
    }

    .box {
      height: 150px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      font-family: sans-serif;
      font-weight: bold;
    }

    /* Mobile (default) */
    .box1 { background-color: red; }
    .box2 { background-color: blue; }
    .box3 { background-color: green; }

    /* Tablet: 768px - 1024px */
    @media (min-width: 768px) and (max-width: 1024px) {
      .container { flex-direction: row; }
      .box { flex: 1; }
      .box1 { background-color: orange; }
      .box2 { background-color: purple; }
      .box3 { background-color: teal; }
    }

    /* Laptop / Desktop: 1025px+ */
    @media (min-width: 1025px) {
      .container { flex-direction: row; }
      .box { flex: 1; }
      .box1 { background-color: crimson; }
      .box2 { background-color: steelblue; }
      .box3 { background-color: seagreen; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
  </div>
</body>
</html>
