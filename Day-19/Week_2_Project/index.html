<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Addis Market — Shopping List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Addis Market</h1>
      <p class="app__subtitle">Your shopping list — add what you need, tick off what's in the basket.</p>
    </header>

    <!-- Add-item form: submit is intercepted with preventDefault (see app.js) -->
    <form id="add-form" class="add-form" autocomplete="off" novalidate>
      <div class="add-form__field">
        <label for="name">Item</label>
        <input id="name" name="name" type="text" placeholder="e.g. Teff flour" />
      </div>

      <div class="add-form__field">
        <label for="price">Price (ETB)</label>
        <input id="price" name="price" type="number" min="0" step="0.01" placeholder="e.g. 250" />
      </div>

      <button type="submit" class="btn btn--add">Add item</button>
    </form>

    <!-- Live region so the total change is announced to screen readers -->
    <section class="summary" aria-live="polite">
      <span class="summary__label">Running total</span>
      <span class="summary__amount">ETB <span id="total">0.00</span></span>
    </section>

    <!-- One delegated click listener lives on this <ul>, never on each row -->
    <ul id="list" class="list" aria-label="Shopping list items"></ul>

    <p id="empty" class="empty">Nothing on the list yet. Add your first item above.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
