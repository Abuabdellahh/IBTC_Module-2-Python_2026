<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Day-21 — localStorage Practice</title>
    <link rel="stylesheet" href="practice.css" />
  </head>
  <body>
    <h1>Day-21 — localStorage Practice</h1>

    <!-- ── Language preference ── -->
    <section>
      <h2>Language Preference</h2>
      <label for="lang">Choose language:</label>
      <select id="lang">
        <option value="en">English</option>
        <option value="am">Amharic</option>
        <option value="fr">French</option>
        <option value="ar">Arabic</option>
      </select>
      <p id="status"></p>
    </section>

    <!-- ── Signup form + validation ── -->
    <section>
      <h2>Sign Up</h2>
      <form id="signup">
        <label for="name">Full name:</label>
        <input id="name" type="text" placeholder="e.g. Almaz" />

        <label for="phone">Phone:</label>
        <input id="phone" type="tel" placeholder="e.g. 0912345678" />

        <button type="submit">Join</button>
      </form>
      <p id="form-status"></p>
    </section>

    <script src="practice.js"></script>
  </body>
</html>
