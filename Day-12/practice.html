<form action="/reserve" method="post">
  <label for="name">Full name</label>
  <input id="name" name="name" required />
  <label for="guests">Guests</label>
  <input id="guests" name="guests" type="number" min="1" max="20" />
  <button type="submit">Reserve</button>
</form>

<fieldset>
  <legend>Delivery address</legend>
  <label for="city">City</label>
  <input id="city" name="city" value="Addis Ababa" />
  <label for="area">Sub-city</label>
  <input id="area" name="area" placeholder="Bole / Kazanchis" />
</fieldset>
<!-- label.for === input.id -->

<form action="/beneficiaries" method="post">
  <fieldset>
    <legend>New beneficiary</legend>
    <label for="name">Full name</label>
    <input id="name" name="name" required autocomplete="name" />
    <label for="acct">Account number</label>
    <input id="acct" name="acct" type="text" pattern="[0-9]{13}" required />
    <label for="amt">Amount (ETB)</label>
    <input id="amt" name="amt" type="number" min="1" step="0.01" required />
  </fieldset>
  <button>Save beneficiary</button>
</form>
